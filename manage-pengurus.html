<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Favicon Resmi HMI -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <title>Kelola Pengurus — Dashboard HMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hmiGreen: '#006B3F',
                        hmiGreenLight: '#008c52',
                        hmiDark: '#004d2c'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="theme.css?v=20260711">
    <script src="theme-toggle.js?v=20260711"></script>
</head>
<body class="min-h-screen bg-slate-50 text-gray-800">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3">
                    <img src="LOGO HMI HD PNG (1).png" alt="Logo HMI" class="h-12 w-auto" />
                    <div>
                        <p class="text-sm font-semibold text-hmiGreen uppercase tracking-[0.2em]">Kelola Struktur</p>
                        <h1 class="text-3xl font-bold">Manajemen Pengurus</h1>
                    </div>
                </a>
            </div>
            <a href="dashboard.html" class="rounded-xl border border-gray-300 px-4 py-2 text-sm font-medium hover:bg-gray-50 transition">Kembali ke Dashboard</a>
        </div>

        <div class="grid lg:grid-cols-[1.05fr_0.95fr] gap-6">
            <div class="bg-white rounded-[2rem] border border-gray-200 shadow-sm p-6 md:p-8">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-bold">Daftar Pengurus</h2>
                        <p class="text-sm text-gray-500">Update susunan pengurus organisasi.</p>
                    </div>
                    <button id="showFormBtn" class="rounded-xl bg-hmiGreen px-4 py-2 text-sm font-semibold text-white hover:bg-hmiDark transition">
                        <i class="fas fa-plus mr-2"></i>Tambah Pengurus
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="min-w-full text-sm">
                        <thead>
                            <tr class="border-b border-gray-200 text-left text-gray-600">
                                <th class="py-3 pr-4">Nama</th>
                                <th class="py-3 pr-4">Jabatan</th>
                                <th class="py-3 pr-4">Divisi</th>
                                <th class="py-3">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="pengurusList"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] border border-gray-200 shadow-sm p-6 md:p-8">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 id="formTitle" class="text-xl font-bold">Tambah Pengurus Baru</h2>
                        <p class="text-sm text-gray-500">Isi data pengurus secara lengkap.</p>
                    </div>
                    <button id="cancelEditBtn" class="hidden rounded-xl border border-gray-300 px-3 py-2 text-sm font-medium hover:bg-gray-50 transition">Batal</button>
                </div>

                <form id="pengurusForm" class="space-y-4">
                    <input type="hidden" id="pengurusId" />
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Lengkap</label>
                        <input id="name" type="text" required class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Jabatan</label>
                        <input id="role" type="text" required class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" placeholder="Contoh: Ketua Umum" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Divisi</label>
                        <input id="division" type="text" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" placeholder="Contoh: Bidang Organisasi" />
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
                        <select id="status" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen">
                            <option value="Aktif">Aktif</option>
                            <option value="Cuti">Cuti</option>
                            <option value="Nonaktif">Nonaktif</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Foto URL</label>
                        <input id="photoUrl" type="text" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" placeholder="Contoh: ketua-umum.jpeg atau URL foto eksternal" />
                        <input id="photoFile" type="file" accept="image/*" class="mt-2" />
                        <div id="photoPreview" class="mt-3 w-28 h-28 rounded-lg overflow-hidden border border-gray-100 hidden"><img id="photoPreviewImg" src="" alt="Preview" class="w-full h-full object-cover"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Catatan</label>
                        <textarea id="notes" rows="4" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen"></textarea>
                    </div>
                    <div class="w-full flex flex-wrap items-start justify-start gap-3 mt-4 pt-2 pl-0 border-t border-gray-100">
                        <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-white px-5 py-2.5 text-sm font-bold text-gray-800 hover:bg-gray-50 active:bg-emerald-600 active:text-white active:border-emerald-600 transition shadow-sm border border-gray-300 min-w-[100px]">Simpan</button>
                        <button type="button" id="doneFormBtn" class="inline-flex items-center justify-center rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm font-semibold text-gray-800 hover:bg-gray-50 active:bg-emerald-600 active:text-white active:border-emerald-600 transition min-w-[100px] shadow-sm">Selesai</button>
                        <button type="button" id="clearFormBtn" class="inline-flex items-center justify-center rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm font-semibold text-gray-800 hover:bg-gray-50 active:bg-emerald-600 active:text-white active:border-emerald-600 transition min-w-[100px] shadow-sm">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const auth = JSON.parse(localStorage.getItem('hmiDashboardAuth') || 'null');
        if (!auth) {
            window.location.href = 'login.html';
        } else if (auth.role !== 'admin') {
            window.location.href = 'dashboard.html?denied=1';
        }

        const pengurusForm = document.getElementById('pengurusForm');
        const pengurusList = document.getElementById('pengurusList');
        const formTitle = document.getElementById('formTitle');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const showFormBtn = document.getElementById('showFormBtn');
        const clearFormBtn = document.getElementById('clearFormBtn');
        const doneFormBtn = document.getElementById('doneFormBtn');
        const photoFile = document.getElementById('photoFile');
        const photoPreview = document.getElementById('photoPreview');
        const photoPreviewImg = document.getElementById('photoPreviewImg');

        if (photoFile) {
            photoFile.addEventListener('change', function () {
                const file = photoFile.files && photoFile.files[0];
                if (!file) {
                    photoPreview.classList.add('hidden');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function (evt) {
                    const dataUrl = evt.target.result;
                    document.getElementById('photoUrl').value = dataUrl;
                    if (photoPreviewImg) {
                        photoPreviewImg.src = dataUrl;
                        photoPreview.classList.remove('hidden');
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        const defaultPengurus = [
            {
                id: 1,
                name: 'Abdi Aswadi',
                role: 'Ketua Umum',
                division: 'Bidang Organisasi',
                status: 'Aktif',
                photoUrl: 'ketua-umum.jpeg',
                notes: ''
            },
            {
                id: 2,
                name: 'Ahmad Barkati',
                role: 'Sekretaris Umum',
                division: 'Bidang Pengkaderan',
                status: 'Aktif',
                photoUrl: 'barkati.jpeg',
                notes: ''
            },
            {
                id: 3,
                name: 'Rida',
                role: 'Bendahara Umum',
                division: 'Bidang Keuangan',
                status: 'Aktif',
                photoUrl: 'rida.jpeg',
                notes: 'Mengelola keuangan dan tata kelola anggaran organisasi.'
            }
        ];

        let pengurusData = JSON.parse(localStorage.getItem('hmiPengurusData') || 'null') || defaultPengurus;
        let editingId = null;

        function savePengurus() {
            localStorage.setItem('hmiPengurusData', JSON.stringify(pengurusData));
        }

        function renderPengurus() {
            pengurusList.innerHTML = '';
            if (!pengurusData.length) {
                pengurusList.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-sm text-gray-500">Belum ada data pengurus. Tambahkan pengurus baru untuk menampilkannya di sini.</td></tr>';
                return;
            }

            pengurusData.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-100';
                row.innerHTML = `
                    <td class="py-3 pr-4 font-medium text-gray-800">${item.name}</td>
                    <td class="py-3 pr-4">${item.role}</td>
                    <td class="py-3 pr-4">${item.division || '-'}</td>
                    <td class="py-3">
                        <button data-action="edit" data-id="${item.id}" class="text-hmiGreen font-semibold text-sm mr-3">Edit</button>
                        <button data-action="delete" data-id="${item.id}" class="text-red-600 font-semibold text-sm">Hapus</button>
                    </td>
                `;
                pengurusList.appendChild(row);
            });
        }

        function resetForm() {
            pengurusForm.reset();
            document.getElementById('pengurusId').value = '';
            editingId = null;
            formTitle.textContent = 'Tambah Pengurus Baru';
            cancelEditBtn.classList.add('hidden');
            if (photoFile) photoFile.value = '';
            if (photoPreview) photoPreview.classList.add('hidden');
        }

        function fillForm(item) {
            document.getElementById('pengurusId').value = item.id;
            document.getElementById('name').value = item.name;
            document.getElementById('role').value = item.role;
            document.getElementById('division').value = item.division;
            document.getElementById('status').value = item.status;
            document.getElementById('photoUrl').value = item.photoUrl || (item.name === 'Abdi Aswadi' ? 'ketua-umum.jpeg' : '');
            if (item.photoUrl && photoPreviewImg && photoPreview) {
                photoPreviewImg.src = item.photoUrl;
                photoPreview.classList.remove('hidden');
            } else if (photoPreview) {
                photoPreview.classList.add('hidden');
            }
            document.getElementById('notes').value = item.notes;
            formTitle.textContent = 'Edit Pengurus';
            cancelEditBtn.classList.remove('hidden');
            editingId = item.id;
        }

        pengurusForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const role = document.getElementById('role').value.trim();
            const division = document.getElementById('division').value.trim();
            const status = document.getElementById('status').value;
            const photoUrl = document.getElementById('photoUrl').value.trim() || (name === 'Abdi Aswadi' ? 'ketua-umum.jpeg' : '');
            const notes = document.getElementById('notes').value.trim();

            if (!name || !role) {
                alert('Nama dan jabatan pengurus wajib diisi.');
                return;
            }

            const member = {
                id: editingId || Date.now(),
                name,
                role,
                division,
                status,
                photoUrl,
                notes
            };

            if (editingId) {
                pengurusData = pengurusData.map(item => item.id === editingId ? member : item);
            } else {
                pengurusData.unshift(member);
            }

            savePengurus();
            renderPengurus();
            resetForm();
            alert('Data pengurus berhasil disimpan.');
        });

        pengurusList.addEventListener('click', function (e) {
            const button = e.target.closest('button');
            if (!button) return;
            const action = button.getAttribute('data-action');
            const id = Number(button.getAttribute('data-id'));

            if (action === 'edit') {
                const member = pengurusData.find(item => item.id === id);
                if (member) {
                    fillForm(member);
                    window.scrollTo({ top: pengurusForm.offsetTop - 24, behavior: 'smooth' });
                }
            }

            if (action === 'delete') {
                if (confirm('Apakah Anda yakin ingin menghapus data pengurus ini?')) {
                    pengurusData = pengurusData.filter(item => item.id !== id);
                    savePengurus();
                    renderPengurus();
                    if (editingId === id) resetForm();
                }
            }
        });

        showFormBtn.addEventListener('click', function () {
            resetForm();
            window.scrollTo({ top: pengurusForm.offsetTop - 24, behavior: 'smooth' });
        });

        clearFormBtn.addEventListener('click', resetForm);
        cancelEditBtn.addEventListener('click', resetForm);
        doneFormBtn.addEventListener('click', resetForm);

        renderPengurus();
    </script>

</body>
</html>
