<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Favicon Resmi HMI -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <title>Kelola Berita — Dashboard HMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hmiGreen: '#006B3F',
                        hmiDark: '#004d2c'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="theme.css?v=20260711">
    <script src="theme-toggle.js?v=20260711"></script>
</head>
<body class="min-h-screen bg-slate-50 text-gray-800">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <a href="index.html" class="flex items-center gap-3">
                    <img src="LOGO HMI HD PNG (1).png" alt="Logo HMI" class="h-12 w-auto" />
                    <div>
                        <p class="text-sm font-semibold text-hmiGreen uppercase tracking-[0.2em]">Kelola Publikasi</p>
                        <h1 class="text-3xl font-bold">Manajemen Berita</h1>
                    </div>
                </a>
            </div>
            <a href="dashboard.html" class="rounded-xl border border-gray-300 px-4 py-2 text-sm font-medium hover:bg-gray-50 transition">Kembali ke Dashboard</a>
        </div>

        <div class="grid lg:grid-cols-[1.1fr_0.9fr] gap-6">
            <div class="bg-white rounded-[2rem] border border-gray-200 shadow-sm p-6 md:p-8">
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-6">
                    <div>
                        <h2 class="text-xl font-bold">Daftar Berita</h2>
                        <p class="text-sm text-gray-500">Tambah, edit, atau hapus berita yang akan tampil di halaman publik.</p>
                    </div>
                    <button id="showFormBtn" class="rounded-xl bg-hmiGreen px-4 py-2 text-sm font-semibold text-white hover:bg-hmiDark transition">
                        <i class="fas fa-plus mr-2"></i>Tambah Berita
                    </button>
                </div>

                <div id="newsList" class="space-y-3"></div>
            </div>

            <div class="bg-white rounded-[2rem] border border-gray-200 shadow-sm p-6 md:p-8">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 id="formTitle" class="text-xl font-bold">Tambah Berita Baru</h2>
                        <p class="text-sm text-gray-500">Isi data berita secara lengkap.</p>
                    </div>
                    <button id="cancelEditBtn" class="hidden rounded-xl border border-gray-300 px-3 py-2 text-sm font-medium hover:bg-gray-50 transition">Batal</button>
                </div>

                <form id="newsForm" class="space-y-4">
                    <input type="hidden" id="newsId" />
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Judul</label>
                        <input id="title" type="text" required class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" />
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Kategori</label>
                        <input id="category" type="text" required class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" placeholder="Contoh: Informasi, Kegiatan" />
                    </div>
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Tanggal</label>
                            <input id="date" type="date" required class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" />
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
                            <select id="status" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen">
                                <option value="Terbit">Terbit</option>
                                <option value="Draft">Draft</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Ringkasan</label>
                        <textarea id="summary" rows="3" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Isi Berita</label>
                        <textarea id="content" rows="7" required class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Gambar/URL</label>
                        <input id="image" type="text" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" placeholder="https://... atau nama file" />
                    </div>
                    <div class="w-full flex flex-wrap items-start justify-start gap-3 mt-4 pt-2 pl-0 border-t border-gray-100">
                        <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-white px-5 py-2.5 text-sm font-bold text-gray-800 hover:bg-gray-50 active:bg-emerald-600 active:text-white active:border-emerald-600 transition shadow-sm border border-gray-300 min-w-[100px] z-10 tracking-wide">Simpan</button>
                        <button type="button" id="doneFormBtn" class="inline-flex items-center justify-center rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm font-semibold text-gray-800 hover:bg-gray-50 active:bg-emerald-600 active:text-white active:border-emerald-600 transition min-w-[100px] shadow-sm">Selesai</button>
                        <button type="button" id="clearFormBtn" class="inline-flex items-center justify-center rounded-xl border border-gray-300 bg-white px-4 py-2.5 text-sm font-semibold text-gray-800 hover:bg-gray-50 active:bg-emerald-600 active:text-white active:border-emerald-600 transition min-w-[100px] shadow-sm">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const auth = JSON.parse(localStorage.getItem('hmiDashboardAuth') || 'null');
        if (!auth) {
            window.location.href = 'login.html';
        }

        const newsForm = document.getElementById('newsForm');
        const newsList = document.getElementById('newsList');
        const formTitle = document.getElementById('formTitle');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const showFormBtn = document.getElementById('showFormBtn');
        const clearFormBtn = document.getElementById('clearFormBtn');
        const doneFormBtn = document.getElementById('doneFormBtn');

        const serverApiBase = 'https://hmi-artikel-backend.darksnowxflower.workers.dev';
        const localServerBase = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? '' : '';

        function isDummyNews(item) {
            if (!item) return true;
            const dummyIds = [1, 2, 3, '1', '2', '3'];
            if (dummyIds.includes(item.id)) return true;
            const title = String(item.title || '').toLowerCase();
            if (
                title.includes('persiapan rapat kerja') || 
                title.includes('latihan kader ii') || 
                title.includes('peluncuran website') ||
                title.includes('intermediate training') ||
                title.includes('portal digital hmi badko')
            ) {
                return true;
            }
            return false;
        }

        let newsData = [];
        let editingId = null;

        async function fetchServerNews() {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const res = await fetch(`${serverApiBase}/news?t=${Date.now()}`, {
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        const clean = data.filter(item => !isDummyNews(item));
                        localStorage.setItem('hmiNewsData', JSON.stringify(clean));
                        return clean;
                    }
                }
            } catch (e) {
                console.warn('Backend fetch fallback:', e);
            }

            // Fallback LocalStorage
            let rawNewsData = JSON.parse(localStorage.getItem('hmiNewsData') || 'null');
            if (Array.isArray(rawNewsData)) {
                rawNewsData = rawNewsData.filter(item => !isDummyNews(item));
                return rawNewsData;
            }
            return [];
        }

        async function initNews() {
            newsList.innerHTML = '<div class="text-sm text-gray-500 py-4 flex items-center gap-2"><i class="fas fa-spinner fa-spin text-hmiGreen"></i> Memuat data berita...</div>';
            newsData = await fetchServerNews();
            renderNews();
        }

        function renderNews() {
            newsList.innerHTML = '';
            if (!newsData.length) {
                newsList.innerHTML = '<div class="text-sm text-gray-500 py-6 text-center border border-dashed border-gray-200 rounded-2xl">Belum ada berita terbit. Silakan tambah berita baru.</div>';
                return;
            }

            newsData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'rounded-2xl border border-gray-200 p-5 bg-gray-50/70 hover:bg-white transition-all shadow-sm';
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="rounded-full bg-emerald-100 text-hmiGreen px-2.5 py-0.5 text-[10px] font-bold uppercase tracking-wider">${item.category || 'Berita'}</span>
                                <span class="text-xs text-gray-400"><i class="far fa-calendar mr-1"></i>${item.date || '-'}</span>
                            </div>
                            <h3 class="font-extrabold text-gray-900 text-base leading-snug">${item.title}</h3>
                            <p class="text-xs text-gray-600 mt-2 line-clamp-2">${item.summary || item.content || ''}</p>
                        </div>
                        <span class="rounded-full ${item.status === 'Terbit' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'} px-3 py-1 text-xs font-semibold shrink-0">${item.status || 'Terbit'}</span>
                    </div>
                    <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-100">
                        <span class="text-[11px] text-gray-400">ID: ${item.id}</span>
                        <div class="flex gap-3">
                            <button type="button" data-action="edit" data-id="${item.id}" class="text-xs text-hmiGreen hover:text-hmiDark font-extrabold flex items-center gap-1">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button type="button" data-action="delete" data-id="${item.id}" class="text-xs text-red-600 hover:text-red-800 font-extrabold flex items-center gap-1">
                                <i class="fas fa-trash"></i> Hapus
                            </button>
                        </div>
                    </div>
                `;
                newsList.appendChild(card);
            });
        }

        function resetForm() {
            newsForm.reset();
            document.getElementById('newsId').value = '';
            editingId = null;
            formTitle.textContent = 'Tambah Berita Baru';
            cancelEditBtn.classList.add('hidden');
        }

        function fillForm(item) {
            document.getElementById('newsId').value = item.id;
            document.getElementById('title').value = item.title;
            document.getElementById('category').value = item.category;
            document.getElementById('date').value = item.date;
            document.getElementById('status').value = item.status || 'Terbit';
            document.getElementById('summary').value = item.summary || '';
            document.getElementById('content').value = item.content || '';
            document.getElementById('image').value = item.image || '';
            formTitle.textContent = 'Edit Berita';
            cancelEditBtn.classList.remove('hidden');
            editingId = item.id;
            window.scrollTo({ top: newsForm.offsetTop - 100, behavior: 'smooth' });
        }

        newsForm.addEventListener('submit', async function (e) {
            e.preventDefault();
            const submitBtn = newsForm.querySelector('button[type="submit"]');
            const origText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Menyimpan...';

            const newsItem = {
                id: editingId || `b-${Date.now()}`,
                title: document.getElementById('title').value.trim(),
                category: document.getElementById('category').value.trim() || 'Informasi',
                date: document.getElementById('date').value || new Date().toISOString().split('T')[0],
                status: document.getElementById('status').value || 'Terbit',
                summary: document.getElementById('summary').value.trim(),
                content: document.getElementById('content').value.trim(),
                image: document.getElementById('image').value.trim(),
                publishedAt: new Date().toISOString()
            };

            if (!newsItem.title || !newsItem.category || !newsItem.date || !newsItem.content) {
                alert('Judul, kategori, tanggal, dan isi berita wajib diisi.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = origText;
                return;
            }

            let savedToServer = false;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                const res = await fetch(`${serverApiBase}/news`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newsItem),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (res.ok) savedToServer = true;
            } catch (err) {
                console.warn('Server push warning:', err);
            }

            // Sync ke local server jika jalan di localhost
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                try {
                    await fetch('/news', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newsItem)
                    });
                } catch (e) {}
            }

            // Update Local Data
            const index = newsData.findIndex(item => String(item.id) === String(newsItem.id));
            if (index >= 0) {
                newsData[index] = newsItem;
            } else {
                newsData.unshift(newsItem);
            }

            localStorage.setItem('hmiNewsData', JSON.stringify(newsData));
            renderNews();
            resetForm();

            submitBtn.disabled = false;
            submitBtn.innerHTML = origText;

            alert(savedToServer ? 'Berita berhasil disimpan dan diterbitkan secara LIVE ke Server Server-Side! 🎉' : 'Berita berhasil disimpan ke memori lokal.');
        });

        newsList.addEventListener('click', async function (e) {
            const button = e.target.closest('button');
            if (!button) return;
            const action = button.getAttribute('data-action');
            const id = button.getAttribute('data-id');

            if (action === 'edit') {
                const item = newsData.find(entry => String(entry.id) === String(id));
                if (item) fillForm(item);
            } else if (action === 'delete') {
                if (confirm('Apakah Anda yakin ingin menghapus berita ini secara permanen dari server?')) {
                    // Send delete request to backend server
                    try {
                        await fetch(`${serverApiBase}/news?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
                    } catch (err) {
                        console.warn('Delete server error:', err);
                    }
                    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                        try { await fetch(`/news?id=${encodeURIComponent(id)}`, { method: 'DELETE' }); } catch (e) {}
                    }

                    newsData = newsData.filter(entry => String(entry.id) !== String(id));
                    localStorage.setItem('hmiNewsData', JSON.stringify(newsData));
                    renderNews();
                    if (editingId && String(editingId) === String(id)) resetForm();
                }
            }
        });

        showFormBtn.addEventListener('click', resetForm);
        clearFormBtn.addEventListener('click', resetForm);
        cancelEditBtn.addEventListener('click', resetForm);
        doneFormBtn.addEventListener('click', resetForm);

        initNews();
    </script>

</body>
</html>
