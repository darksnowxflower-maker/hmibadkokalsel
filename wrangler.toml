name = "hmi-artikel-backend"
main = "worker.js"
compatibility_date = "2025-12-01"
workers_dev = true
assets = { directory = "./", binding = "ASSETS" }

routes = [
  { pattern = "hmibadkokalsel.web.id/detail-artikel*", zone_name = "hmibadkokalsel.web.id" },
  { pattern = "hmibadkokalsel.web.id/berita*", zone_name = "hmibadkokalsel.web.id" },
  { pattern = "hmibadkokalsel.web.id/api/*", zone_name = "hmibadkokalsel.web.id" }
]

[[kv_namespaces]]
binding = "ARTICLES_KV"
id = "c0f96969d11a4a34aeca5c42f8a67405"

[[kv_namespaces]]
binding = "PENDING_KV"
id = "5e776ee7670b4b6eb0adf04a7b4ddbf0"
