<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Favicon Resmi HMI -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <title>Kelola Program Kerja — HMI Badko Kalsel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        hmiGreen: '#006B3F',
                        hmiGreenLight: '#008c52',
                        hmiDark: '#004d2c'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="theme.css?v=20260711">
    <script src="theme-toggle.js?v=20260711"></script>
</head>
<body class="min-h-screen bg-slate-50 text-gray-800">
    <div class="min-h-screen flex flex-col">
        <header class="bg-white shadow-sm border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="flex items-center gap-3">
                        <img src="LOGO HMI HD PNG (1).png" alt="Logo HMI" class="h-12 w-auto" />
                        <div>
                            <p class="text-sm font-semibold text-hmiGreen uppercase tracking-[0.2em]">Panel Kendali</p>
                            <h1 class="text-2xl font-bold">Kelola Program Kerja</h1>
                        </div>
                    </a>
                </div>
                <div class="flex items-center gap-3">
                    <a href="dashboard.html" class="rounded-xl border border-gray-200 px-4 py-2 text-sm font-medium hover:bg-gray-50 transition">
                        <i class="fas fa-arrow-left mr-2"></i>Kembali ke Dashboard
                    </a>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
            <div class="grid lg:grid-cols-3 gap-8">
                <!-- List Proker -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white rounded-[2rem] border border-gray-200 shadow-sm p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                            <div>
                                <h2 class="text-xl font-bold">Daftar Program Kerja</h2>
                                <p class="text-sm text-gray-500 mt-0.5">Pantau status pelaksanaan dan persentase progress proker.</p>
                            </div>
                            <select id="filterCategory" class="rounded-xl border border-gray-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-hmiGreen">
                                <option value="Semua">Semua Kategori</option>
                                <option value="Pendidikan">Pendidikan</option>
                                <option value="Kaderisasi">Kaderisasi</option>
                                <option value="Advokasi">Advokasi</option>
                                <option value="Keagamaan">Keagamaan</option>
                                <option value="Sosial">Sosial</option>
                            </select>
                        </div>

                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead>
                                    <tr class="border-b border-gray-200 text-gray-500 font-semibold">
                                        <th class="py-3 pr-4">Nama Program</th>
                                        <th class="py-3 pr-4">Kategori</th>
                                        <th class="py-3 pr-4">Status & Progress</th>
                                        <th class="py-3 pr-4">Target</th>
                                        <th class="py-3">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="prokerList"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Form Input -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-[2rem] border border-gray-200 shadow-sm p-6 md:p-8 sticky top-28">
                        <div class="flex items-center justify-between mb-6">
                            <div>
                                <h2 id="formTitle" class="text-xl font-bold">Tambah Proker Baru</h2>
                                <p class="text-sm text-gray-500">Lengkapi detail program kerja organisasi.</p>
                            </div>
                            <button id="cancelEditBtn" class="hidden rounded-xl border border-gray-300 px-3 py-2 text-sm font-medium hover:bg-gray-50 transition">Batal</button>
                        </div>

                        <form id="prokerForm" class="space-y-4">
                            <input type="hidden" id="prokerId" />
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Nama Program Kerja</label>
                                <input id="title" type="text" required class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" placeholder="Contoh: Gerakan Literasi Kader" />
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Kategori</label>
                                <select id="category" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen">
                                    <option value="Pendidikan">Pendidikan</option>
                                    <option value="Kaderisasi">Kaderisasi</option>
                                    <option value="Advokasi">Advokasi</option>
                                    <option value="Keagamaan">Keagamaan</option>
                                    <option value="Sosial">Sosial</option>
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
                                    <select id="status" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen">
                                        <option value="Belum Terlaksana">Belum Terlaksana</option>
                                        <option value="Berjalan">Berjalan</option>
                                        <option value="Terlaksana">Terlaksana</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-gray-700 mb-2">Progress (%)</label>
                                    <input id="progress" type="number" min="0" max="100" required class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" value="0" />
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Target Peserta / Capaian</label>
                                <input id="target" type="text" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" placeholder="Contoh: 300+ kader aktif" />
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-700 mb-2">Deskripsi Singkat</label>
                                <textarea id="description" rows="4" class="w-full rounded-xl border border-gray-200 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-hmiGreen" placeholder="Tuliskan tujuan dan penjelasan singkat program kerja ini..."></textarea>
                            </div>

                            <button type="submit" class="w-full rounded-xl bg-hmiGreen px-5 py-3 text-sm font-bold text-white hover:bg-hmiDark transition shadow-md mt-4">Simpan Program Kerja</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Script JavaScript untuk Kelola Proker -->
    <script>
        const auth = JSON.parse(localStorage.getItem('hmiDashboardAuth') || 'null');
        if (!auth) {
            window.location.href = 'login.html';
        } else if (auth.role !== 'admin') {
            window.location.href = 'dashboard.html?denied=1';
        }

        const prokerForm = document.getElementById('prokerForm');
        const prokerList = document.getElementById('prokerList');
        const formTitle = document.getElementById('formTitle');
        const cancelEditBtn = document.getElementById('cancelEditBtn');
        const filterCategory = document.getElementById('filterCategory');

        const defaultProker = [
            {
                id: 1,
                title: 'Gerakan Literasi & Akademik',
                category: 'Pendidikan',
                status: 'Berjalan',
                progress: 78,
                target: '300+ Kader',
                description: 'Meningkatkan minat baca, workshop soft skill, dan pendampingan belajar bagi mahasiswa.'
            },
            {
                id: 2,
                title: 'Kaderisasi Talenta HMI',
                category: 'Kaderisasi',
                status: 'Berjalan',
                progress: 65,
                target: '200+ Peserta',
                description: 'Pelatihan kepemimpinan, public speaking, dan pembinaan calon pengurus daerah.'
            },
            {
                id: 3,
                title: 'Advokasi Mahasiswa & Komunitas',
                category: 'Advokasi',
                status: 'Berjalan',
                progress: 82,
                target: '150+ Kader',
                description: 'Membuka ruang dialog dengan pihak kampus dan komunitas untuk isu strategis mahasiswa.'
            }
        ];

        let prokerData = JSON.parse(localStorage.getItem('hmiProkerData') || 'null');
        if (!prokerData) {
            prokerData = defaultProker;
            localStorage.setItem('hmiProkerData', JSON.stringify(prokerData));
        }

        let editingId = null;

        function saveProker() {
            localStorage.setItem('hmiProkerData', JSON.stringify(prokerData));
        }

        function renderProker() {
            prokerList.innerHTML = '';
            const categoryFilter = filterCategory.value;

            const filtered = prokerData.filter(item => categoryFilter === 'Semua' || item.category === categoryFilter);

            if (!filtered.length) {
                prokerList.innerHTML = '<tr><td colspan="5" class="py-6 text-center text-sm text-gray-500">Belum ada program kerja. Tambahkan program baru.</td></tr>';
                return;
            }

            filtered.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'border-b border-gray-100';

                let statusBadge = '';
                if (item.status === 'Terlaksana') {
                    statusBadge = '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">Terlaksana</span>';
                } else if (item.status === 'Berjalan') {
                    statusBadge = '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800">Berjalan</span>';
                } else {
                    statusBadge = '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-800">Belum Mulai</span>';
                }

                row.innerHTML = `
                    <td class="py-3.5 pr-4 font-bold text-gray-800">${item.title}</td>
                    <td class="py-3.5 pr-4">${item.category}</td>
                    <td class="py-3.5 pr-4">
                        <div class="flex items-center gap-2">
                            ${statusBadge}
                            <span class="font-bold text-xs">${item.progress}%</span>
                        </div>
                        <div class="w-24 bg-gray-100 h-1.5 rounded-full overflow-hidden mt-1">
                            <div class="h-full bg-hmiGreen" style="width: ${item.progress}%"></div>
                        </div>
                    </td>
                    <td class="py-3.5 pr-4 font-medium text-gray-700">${item.target || '-'}</td>
                    <td class="py-3.5">
                        <button data-action="edit" data-id="${item.id}" class="text-hmiGreen font-semibold text-xs mr-3"><i class="fas fa-edit"></i> Edit</button>
                        <button data-action="delete" data-id="${item.id}" class="text-red-600 font-semibold text-xs"><i class="fas fa-trash"></i> Hapus</button>
                    </td>
                `;
                prokerList.appendChild(row);
            });
        }

        function resetForm() {
            prokerForm.reset();
            document.getElementById('prokerId').value = '';
            document.getElementById('progress').value = '0';
            editingId = null;
            formTitle.textContent = 'Tambah Proker Baru';
            cancelEditBtn.classList.add('hidden');
        }

        function fillForm(item) {
            document.getElementById('prokerId').value = item.id;
            document.getElementById('title').value = item.title;
            document.getElementById('category').value = item.category;
            document.getElementById('status').value = item.status;
            document.getElementById('progress').value = item.progress;
            document.getElementById('target').value = item.target || '';
            document.getElementById('description').value = item.description || '';
            
            formTitle.textContent = 'Edit Program Kerja';
            cancelEditBtn.classList.remove('hidden');
            editingId = item.id;
        }

        prokerForm.addEventListener('submit', function (e) {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const status = document.getElementById('status').value;
            const progress = Number(document.getElementById('progress').value);
            const target = document.getElementById('target').value.trim();
            const description = document.getElementById('description').value.trim();

            if (!title) {
                alert('Nama program kerja wajib diisi.');
                return;
            }

            const prokerItem = {
                id: editingId || Date.now(),
                title,
                category,
                status,
                progress,
                target,
                description
            };

            if (editingId) {
                prokerData = prokerData.map(item => item.id === editingId ? prokerItem : item);
            } else {
                prokerData.unshift(prokerItem);
            }

            saveProker();
            renderProker();
            resetForm();
            alert('Program kerja berhasil disimpan.');
        });

        prokerList.addEventListener('click', function(e) {
            const button = e.target.closest('button');
            if (!button) return;

            const action = button.getAttribute('data-action');
            const id = Number(button.getAttribute('data-id'));

            if (action === 'edit') {
                const item = prokerData.find(p => p.id === id);
                if (item) fillForm(item);
            }

            if (action === 'delete') {
                if (confirm('Apakah Anda yakin ingin menghapus program kerja ini?')) {
                    prokerData = prokerData.filter(p => p.id !== id);
                    saveProker();
                    renderProker();
                    if (editingId === id) resetForm();
                }
            }
        });

        cancelEditBtn.addEventListener('click', resetForm);
        filterCategory.addEventListener('change', renderProker);

        // Inisialisasi
        renderProker();
    </script>

</body>
</html>
